<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proyecto — María Feria</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream:#faf7f2; --cream2:#f0e9db;
      --green:#4a5a3e; --green3:#9baa8b;
      --terra:#b85c38; --terra2:#d4825f;
      --ink:#1a1a17;   --ink2:#3a3a35;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{background:var(--ink);color:var(--cream);font-family:'DM Sans',sans-serif;font-weight:300;overflow-x:hidden;cursor:none;}

    /* CURSOR */
    #cursor-dot{position:fixed;width:8px;height:8px;background:var(--terra);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);}
    #cursor-ring{position:fixed;width:36px;height:36px;border:1.5px solid rgba(250,247,242,.3);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .3s,height .3s,border-color .3s,background .3s;}
    body.ch #cursor-dot{width:0;height:0;}
    body.ch #cursor-ring{width:60px;height:60px;border-color:var(--terra);background:rgba(184,92,56,.07);}

    /* NAV */
    nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:1.3rem 5vw 4rem;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(to bottom,rgba(26,26,23,.93) 0%,rgba(26,26,23,.88) 55%,rgba(26,26,23,.22) 85%,transparent 100%);}
    .nav-logo{font-family:'Playfair Display',serif;font-size:1rem;color:var(--cream);text-decoration:none;}
    .nav-back{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(250,247,242,.45);text-decoration:none;transition:color .2s;}
    .nav-back:hover{color:var(--terra);}

    /* HERO */
    .proj-hero{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 5vw 5rem;position:relative;overflow:hidden;}
    .hero-bg{position:absolute;inset:0;z-index:0;}
    .hero-bg img{width:100%;height:100%;object-fit:cover;transform:scale(1.1);filter:brightness(.22) saturate(.5);}
    .hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(26,26,23,.98) 0%,rgba(26,26,23,.35) 65%,transparent 100%);}
    .hero-content{position:relative;z-index:1;}

    .proj-label{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--terra);margin-bottom:1.5rem;opacity:0;transform:translateY(20px);animation:fadeUp .7s .2s forwards;}
    .proj-title{font-family:'Playfair Display',serif;font-size:clamp(2.5rem,6vw,6.5rem);line-height:.95;letter-spacing:-.02em;color:var(--cream);overflow:hidden;}
    .proj-title .line{display:block;transform:translateY(110%);animation:slideUp .9s cubic-bezier(.16,1,.3,1) forwards;}
    .proj-title .line:nth-child(1){animation-delay:.4s;}
    .proj-title .line:nth-child(2){animation-delay:.55s;color:var(--terra2);font-style:italic;}

    .hero-meta-row{display:flex;gap:3rem;flex-wrap:wrap;margin-top:3rem;padding-top:2rem;border-top:1px solid rgba(250,247,242,.1);opacity:0;transform:translateY(20px);animation:fadeUp .7s .9s forwards;}
    .meta-col{display:flex;flex-direction:column;gap:.3rem;}
    .meta-key{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--terra);}
    .meta-val{font-size:.85rem;color:rgba(250,247,242,.6);line-height:1.45;max-width:30ch;}

    /* GALERÍA */
    .gallery-section{padding:5rem 5vw 7rem;background:var(--ink);}
    .gallery-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:2.5rem;padding-bottom:1.2rem;border-bottom:1px solid rgba(250,247,242,.08);}
    .gallery-header h2{font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--cream);}
    .gallery-count{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(250,247,242,.28);}

    /* GRID 4 COL */
    .gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem;}

    .gallery-item{
      position:relative;overflow:hidden;border-radius:.35rem;cursor:none;
      background:var(--ink2);
      opacity:0;
      transform:translateY(28px);
      transition:opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1), box-shadow .35s;
    }
    .gallery-item.revealed{opacity:1;transform:translateY(0);}
    .gallery-item:hover{transform:translateY(-4px);box-shadow:0 18px 45px rgba(0,0,0,.55);}

    .gallery-item img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;transition:transform .65s cubic-bezier(.16,1,.3,1);}
    .gallery-item:hover img{transform:scale(1.07);}

    .g-overlay{position:absolute;inset:0;background:rgba(74,90,62,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;}
    .gallery-item:hover .g-overlay{opacity:1;}
    .g-num{font-family:'Playfair Display',serif;font-size:2.2rem;color:rgba(250,247,242,.9);}
    .g-ver{position:absolute;bottom:.8rem;right:.9rem;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(250,247,242,.55);}

    /* LIGHTBOX */
    #lightbox{display:none;position:fixed;inset:0;z-index:9999;background:rgba(18,18,15,.97);align-items:center;justify-content:center;flex-direction:column;}
    #lightbox.open{display:flex;animation:lbIn .3s ease;}
    @keyframes lbIn{from{opacity:0}to{opacity:1}}
    #lb-img{max-width:84vw;max-height:80vh;object-fit:contain;border-radius:.35rem;box-shadow:0 40px 100px rgba(0,0,0,.7);transition:opacity .18s;}
    .lb-close{position:absolute;top:1.5rem;right:2rem;background:none;border:none;color:rgba(250,247,242,.45);font-size:2rem;cursor:none;transition:color .2s;}
    .lb-close:hover{color:var(--terra);}
    .lb-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(250,247,242,.07);border:1px solid rgba(250,247,242,.1);border-radius:50%;color:rgba(250,247,242,.65);width:50px;height:50px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;cursor:none;transition:background .2s,color .2s,transform .2s;}
    .lb-arrow:hover{background:var(--terra);border-color:var(--terra);color:#fff;transform:translateY(-50%) scale(1.08);}
    .lb-arrow.prev{left:1.5rem;} .lb-arrow.next{right:1.5rem;}
    .lb-counter{margin-top:1rem;font-size:.73rem;letter-spacing:.14em;color:rgba(250,247,242,.3);}

    /* FOOTER */
    footer{background:var(--ink);border-top:1px solid rgba(250,247,242,.06);color:rgba(250,247,242,.28);padding:1.8rem 5vw;display:flex;justify-content:space-between;font-size:.74rem;}
    footer a{color:var(--green3);text-decoration:none;}

    @keyframes fadeUp{to{opacity:1;transform:translateY(0);}}
    @keyframes slideUp{to{transform:translateY(0);}}

    /* RESPONSIVE */
    @media(max-width:1100px){.gallery-grid{grid-template-columns:repeat(3,1fr);}}
    @media(max-width:768px){
      body{cursor:auto;}
      #cursor-dot,#cursor-ring{display:none;}
      .gallery-grid{grid-template-columns:repeat(2,1fr);gap:.6rem;}
      .hero-meta-row{gap:1.5rem;}
      .lb-arrow{display:none;}
    }
    @media(max-width:480px){.gallery-grid{grid-template-columns:repeat(2,1fr);gap:.5rem;}}
  </style>
</head>
<body>

<div id="cursor-dot"></div>
<div id="cursor-ring"></div>

<nav>
  <a class="nav-logo" href="index.html">María Feria</a>
  <a class="nav-back" href="index.html">← Portfolio</a>
</nav>

<section class="proj-hero">
  <div class="hero-bg"><img id="hero-bg-img" src="" alt="" /></div>
  <div class="hero-content">
    <p class="proj-label" id="proj-label"></p>
    <h1 class="proj-title" id="proj-title"></h1>
    <div class="hero-meta-row" id="hero-meta"></div>
  </div>
</section>

<section class="gallery-section">
  <div class="gallery-header">
    <h2>Imágenes del proyecto</h2>
    <span class="gallery-count" id="gallery-count"></span>
  </div>
  <div class="gallery-grid" id="gallery-grid"></div>
</section>

<div id="lightbox">
  <button class="lb-close" onclick="closeLb()">✕</button>
  <button class="lb-arrow prev" onclick="lbNav(-1)">‹</button>
  <img id="lb-img" src="" alt="" onclick="event.stopPropagation()" />
  <button class="lb-arrow next" onclick="lbNav(1)">›</button>
  <span class="lb-counter" id="lb-counter"></span>
</div>

<footer>
  <span>© 2026 María Feria Cañasveras</span>
  <a href="mailto:fercanmaria@gmail.com">fercanmaria@gmail.com</a>
</footer>

<script src="config.js"></script>
<script>
  // Lee proyecto desde config.js
  const params = new URLSearchParams(window.location.search);
  const pid    = params.get('p');
  const pData  = PROYECTOS.find(p => p.id === pid);

  if (!pData) {
    document.body.innerHTML = '<div style="padding:8rem 5vw;text-align:center;"><p style="color:var(--terra);margin-bottom:1rem;">Proyecto no encontrado</p><a href="index.html" style="color:var(--cream);">← Volver</a></div>';
  } else {
    document.title = pData.titulo + ' ' + pData.subtitulo + ' — María Feria';
    document.getElementById('proj-label').textContent = pData.etiqueta;
    document.getElementById('hero-bg-img').src = pData.cover;

    // Título en dos líneas
    const titleEl = document.getElementById('proj-title');
    [pData.titulo, pData.subtitulo].filter(Boolean).forEach(t => {
      const s = document.createElement('span');
      s.className = 'line'; s.textContent = t;
      titleEl.appendChild(s);
    });

    // Meta
    const metaEl = document.getElementById('hero-meta');
    [
      { key: 'Cliente',     val: pData.cliente },
      { key: 'Año',         val: pData.año },
      { key: 'Servicios',   val: pData.servicios },
      { key: 'Descripción', val: pData.descripcion },
    ].forEach(m => {
      if (!m.val) return;
      metaEl.innerHTML += `<div class="meta-col"><span class="meta-key">${m.key}</span><span class="meta-val">${m.val}</span></div>`;
    });

    // Galería
    document.getElementById('gallery-count').textContent = pData.imagenes.length + ' imágenes';
    const grid = document.getElementById('gallery-grid');
    pData.imagenes.forEach((src, i) => {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      item.style.transitionDelay = (i % 4) * 0.07 + 's';
      item.innerHTML = `<img src="${src}" alt="Imagen ${i+1}" loading="lazy"/>
        <div class="g-overlay"><span class="g-num">${String(i+1).padStart(2,'0')}</span><span class="g-ver">Ver →</span></div>`;
      item.addEventListener('click', () => openLb(i));
      grid.appendChild(item);
    });

    // Reveal con clip-path al hacer scroll
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('revealed'); obs.unobserve(e.target); }});
    }, { threshold:.04, rootMargin:'0px 0px -30px 0px' });
    document.querySelectorAll('.gallery-item').forEach(el => obs.observe(el));
  }

  // LIGHTBOX
  let lbIdx = 0;
  const images = pData ? pData.imagenes : [];

  function openLb(i) {
    lbIdx = i;
    document.getElementById('lb-img').src = images[i];
    document.getElementById('lb-counter').textContent = (i+1) + ' / ' + images.length;
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLb() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }

  function lbNav(dir) {
    lbIdx = (lbIdx + dir + images.length) % images.length;
    const img = document.getElementById('lb-img');
    img.style.opacity = '0';
    setTimeout(() => { img.src = images[lbIdx]; img.style.opacity = '1'; }, 150);
    document.getElementById('lb-counter').textContent = (lbIdx+1) + ' / ' + images.length;
  }

  document.getElementById('lightbox').addEventListener('click', e => { if(e.target===e.currentTarget) closeLb(); });
  document.addEventListener('keydown', e => {
    if(!document.getElementById('lightbox').classList.contains('open')) return;
    if(e.key==='Escape') closeLb();
    if(e.key==='ArrowLeft') lbNav(-1);
    if(e.key==='ArrowRight') lbNav(1);
  });

  // CURSOR
  const dot=document.getElementById('cursor-dot'), ring=document.getElementById('cursor-ring');
  let mx=0,my=0,rx=0,ry=0;
  document.addEventListener('mousemove',e=>{ mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px'; });
  (function loop(){ rx+=(mx-rx)*.12;ry+=(my-ry)*.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(loop); })();
  document.querySelectorAll('a,button,.gallery-item').forEach(el=>{
    el.addEventListener('mouseenter',()=>document.body.classList.add('ch'));
    el.addEventListener('mouseleave',()=>document.body.classList.remove('ch'));
  });

  // PARALLAX HERO
  const bgImg = document.getElementById('hero-bg-img');
  window.addEventListener('scroll',()=>{ bgImg.style.transform=`scale(1.1) translateY(${window.scrollY*.22}px)`; },{passive:true});
</script>
</body>
</html>
